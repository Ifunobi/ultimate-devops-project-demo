# CI for Product Catalog Application

name: product-catalog-ci

on:
  pull_request:
    branches:
      - main

jobs:  
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v2
          with:
            go-version: '1.22'

        - name: Build
          run: | 
            cd src/product-catalog
            go mod download            
            go build -o product-catalog-service main.go

        - name: unit tests
          run: | 
            cd src/product-catalog
            go test ./...


    code-quality:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v2
          with:
            go-version: '1.22'

        - name: Install golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: v1.55.2

        - name: Run golangci-lint
          run: golangci-lint run src/product-catalog/...
    
    
    docker:
        runs-on: ubuntu-latest
        needs: build

        steps:
        - name: Checkout code
          uses: actions/checkout@v4
        
        - name: Install Docker
          uses: docker/setup-buildx-action@v2

        - name: Log in to Docker Hub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_HUB_USERNAME }}
            password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

        - name: Docker Push
          uses: docker/build-push-action@v6
          with:
            context: src/product-catalog
            file: src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_HUB_USERNAME }}/product-catalog:${{github.run_id}}
            build-args: |
              BUILD_VERSION=${{github.run_id}}
              BUILD_DATE=${{ github.event.head_commit.timestamp }}
        
    update-k8s-manifest:
        runs-on: ubuntu-latest
        needs: docker
        steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

        - name: Update tag in k8s manifest
          run: |
            sed -i 's|image: .*|image: '"${{ secrets.DOCKER_HUB_USERNAME }}"'/product-catalog:'"${{github.run_id }}"'|g' kubernetes/productcatalog/deploy.yaml
        

        - name: Commit and Push changes
          run: |
            git config --global user.name "Chukwuemeka Nwanisobi"
            git config --global user.email "obicass@gmail.com"
            git checkout main
            git add kubernetes/productcatalog/deploy.yaml
            git commit -m "Update product-catalog-service image tag using CI to ${{github.run_id}}"
            git push origin main



        